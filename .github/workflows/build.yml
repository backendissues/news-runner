# Builds The Thread every hour and publishes the finished pages.
# The code itself lives in a private repository; this file only knows how to fetch and run it.
name: build
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Fetch the private source
        env:
          SRC_KEY: ${{ secrets.SRC_KEY }}
        run: |
          install -m 600 /dev/null ~/src_key && printf '%s\n' "$SRC_KEY" > ~/src_key
          GIT_SSH_COMMAND="ssh -i ~/src_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new" \
            git clone --depth 1 git@github.com:backendissues/news-thread.git src
          rm -f ~/src_key

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/pipeline/requirements.txt

      - name: Install
        run: pip install -r src/pipeline/requirements.txt

      - name: Restore the 72 hour article pool
        uses: actions/cache/restore@v4
        with:
          path: src/pipeline/state
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Build
        working-directory: src
        run: |
          python pipeline/process.py
          python pipeline/render.py
          # never publish a broken run: most feeds must have answered
          ok=$(python -c "import json;print(json.load(open('site/data/meta.json'))['feeds_ok'])")
          echo "feeds ok: $ok"
          [ "$ok" -ge 15 ] || { echo "::error::only $ok feeds answered, keeping the previous site"; exit 1; }

      - name: Save the article pool
        uses: actions/cache/save@v4
        with:
          path: src/pipeline/state
          key: state-${{ github.run_id }}

      - name: Publish the finished pages
        env:
          BUILT_KEY: ${{ secrets.BUILT_KEY }}
        run: |
          install -m 600 /dev/null ~/built_key && printf '%s\n' "$BUILT_KEY" > ~/built_key
          export GIT_SSH_COMMAND="ssh -i ~/built_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new"
          git clone --depth 1 git@github.com:backendissues/news-built.git built
          rsync -a --delete --exclude '.git' src/site/ built/
          cd built
          git config user.name "build"; git config user.email "build@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "no changes"; else
            git commit -q -m "Edition $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push origin HEAD:main
          fi
          rm -f ~/built_key
